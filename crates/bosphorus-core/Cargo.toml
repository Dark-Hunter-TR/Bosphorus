[package]
name = "bosphorus-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DPI evasion + discovery core; platform-agnostic (no WinDivert dependency)"
publish = false

[dependencies]
thiserror = { workspace = true }
tracing = "0.1"
parking_lot = "0.12"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
